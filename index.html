  <script>
    const THEME_STORAGE_KEY = "wine_noxide_theme";

    // Публичные параметры Supabase. Секретный ключ сюда добавлять нельзя.
    const SUPABASE_URL = "https://codzwvlvrawmlxbycnnf.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_ruhJEJBuaMctqYyAOV2QvQ_VFTJlEZL";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    let posts = [];
    let searchQuery = "";
    let currentBase64 = "";
    let selectedImageFile = null;
    let isAdmin = false;

    const postsList = document.getElementById("postsList");
    const emptyState = document.getElementById("emptyState");
    const emptyHint = document.getElementById("emptyHint");
    const countNumber = document.getElementById("countNumber");
    const searchInput = document.getElementById("searchInput");
    const clearSearchBtn = document.getElementById("clearSearchBtn");
    const postModal = document.getElementById("postModal");
    const postForm = document.getElementById("postForm");
    const modalTitle = document.getElementById("modalTitle");
    const editPostId = document.getElementById("editPostId");
    const openModalBtn = document.getElementById("openModalBtn");
    const closeModalBtn = document.getElementById("closeModalBtn");
    const cancelModalBtn = document.getElementById("cancelModalBtn");

    const adminLoginBtn = document.getElementById("adminLoginBtn");
    const adminLogoutBtn = document.getElementById("adminLogoutBtn");
    const adminControlsHeader = document.getElementById("adminControlsHeader");
    const loginModal = document.getElementById("loginModal");
    const loginForm = document.getElementById("loginForm");
    const closeLoginModalBtn = document.getElementById("closeLoginModalBtn");
    const adminPasswordInput = document.getElementById("adminPasswordInput");
    const adminEmailInput = document.getElementById("adminEmailInput");
    const loginErrorMessage = document.getElementById("loginErrorMessage");
    const themeToggleBtn = document.getElementById("themeToggleBtn");
    const themeIconSun = document.getElementById("themeIconSun");
    const themeIconMoon = document.getElementById("themeIconMoon");

    const tabUrl = document.getElementById("tabUrl");
    const tabFile = document.getElementById("tabFile");
    const urlInputContainer = document.getElementById("urlInputContainer");
    const fileInputContainer = document.getElementById("fileInputContainer");
    const postImageUrl = document.getElementById("postImageUrl");
    const postImageFile = document.getElementById("postImageFile");
    const uploadFileName = document.getElementById("uploadFileName");
    const modalImagePreviewContainer = document.getElementById("modalImagePreviewContainer");
    const modalImagePreview = document.getElementById("modalImagePreview");
    const removePreviewBtn = document.getElementById("removePreviewBtn");

    const lightboxModal = document.getElementById("lightboxModal");
    const lightboxImage = document.getElementById("lightboxImage");
    const lightboxCaption = document.getElementById("lightboxCaption");
    const closeLightboxBtn = document.getElementById("closeLightboxBtn");

    document.getElementById("currentYear").textContent = new Date().getFullYear();

    async function init() {
      initTheme();
      setupEventListeners();
      await checkAdminStatus();
      await loadPosts();
      renderPosts();
      lucide.createIcons();
    }

    function initTheme() {
      const savedTheme = localStorage.getItem(THEME_STORAGE_KEY) || "dark";
      applyTheme(savedTheme);
    }

    function applyTheme(theme) {
      if (theme === "dark") {
        document.documentElement.classList.add("dark");
        themeIconSun.classList.remove("hidden");
        themeIconMoon.classList.add("hidden");
      } else {
        document.documentElement.classList.remove("dark");
        themeIconSun.classList.add("hidden");
        themeIconMoon.classList.remove("hidden");
      }
      localStorage.setItem(THEME_STORAGE_KEY, theme);
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.contains("dark");
      applyTheme(isDark ? "light" : "dark");
    }

    async function checkAdminStatus() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      isAdmin = !!session?.user;
      updateAdminUI();

      supabaseClient.auth.onAuthStateChange((_event, session) => {
        isAdmin = !!session?.user;
        updateAdminUI();
        renderPosts();
      });
    }

    function updateAdminUI() {
      if (isAdmin) {
        adminLoginBtn.classList.add("hidden");
        adminControlsHeader.classList.remove("hidden");
      } else {
        adminLoginBtn.classList.remove("hidden");
        adminControlsHeader.classList.add("hidden");
      }
    }

    async function loadPosts() {
      const { data, error } = await supabaseClient
        .from("posts")
        .select("*")
        .order("created_at", { ascending: false });

      if (error) {
        console.error("Supabase load error:", error);
        posts = [];
        showToast("Не удалось загрузить проекты");
        return;
      }

      posts = (data || []).map(row => ({
        id: row.id,
        title: row.title,
        description: row.description,
        link: row.link,
        imageUrl: row.image_url,
        createdAt: row.created_at
      }));
    }

    async function uploadProjectImage(file) {
      const extension = (file.name.split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g, "") || "jpg";
      const path = `${crypto.randomUUID()}.${extension}`;
      const { error } = await supabaseClient.storage
        .from("project-images")
        .upload(path, file, { upsert: false, contentType: file.type || "image/jpeg" });

      if (error) throw error;
      const { data } = supabaseClient.storage.from("project-images").getPublicUrl(path);
      return data.publicUrl;
    }

    function showToast(message) {
      const toast = document.getElementById("toastNotification");
      const toastMessage = document.getElementById("toastMessage");
      toastMessage.textContent = message;
      toast.classList.remove("hidden");
      toast.classList.add("flex");

      setTimeout(() => {
        toast.classList.add("hidden");
        toast.classList.remove("flex");
      }, 2500);
    }

    function formatDate(isoString) {
      try {
        const d = new Date(isoString);
        return d.toLocaleDateString("ru-RU", {
          day: "2-digit",
          month: "short",
          year: "numeric"
        });
      } catch {
        return "Недавно";
      }
    }

    function renderPosts() {
      const q = searchQuery.toLowerCase().trim();
      const filtered = posts.filter(post => {
        return !q || 
          post.title.toLowerCase().includes(q) ||
          post.description.toLowerCase().includes(q);
      });

      countNumber.textContent = filtered.length;

      if (filtered.length === 0) {
        postsList.innerHTML = "";
        emptyState.classList.remove("hidden");
        emptyHint.textContent = searchQuery ? "Ничего не найдено по вашему запросу" : "Проекты еще не опубликованы";
        return;
      }

      emptyState.classList.add("hidden");

      postsList.innerHTML = filtered.map(post => {
        const dateStr = formatDate(post.createdAt);
        const imgUrl = post.imageUrl;

        const adminActions = isAdmin ? `
          <div class="flex items-center gap-1 opacity-90 sm:opacity-40 group-hover:opacity-100 transition-opacity">
            <button onclick="editPost('${post.id}')" title="Редактировать" class="p-1.5 rounded hover:bg-zinc-200 dark:hover:bg-zinc-800 text-zinc-500 hover:text-black dark:hover:text-white transition-colors">
              <i data-lucide="edit-3" class="w-3.5 h-3.5"></i>
            </button>
            <button onclick="deletePost('${post.id}')" title="Удалить" class="p-1.5 rounded hover:bg-zinc-200 dark:hover:bg-zinc-800 text-zinc-500 hover:text-rose-500 transition-colors">
              <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
            </button>
          </div>
        ` : '';

        return `
          <article class="group bg-white dark:bg-[#121212] border border-zinc-200 dark:border-zinc-800 rounded-xl overflow-hidden shadow-sm transition-all duration-200 hover:border-zinc-400 dark:hover:border-zinc-700">
            <div class="px-5 sm:px-6 pt-5 pb-2 flex items-start justify-between gap-4">
              <div class="space-y-1">
                <span class="text-[11px] font-mono text-zinc-400 dark:text-zinc-500">${dateStr}</span>
                <h2 class="text-base sm:text-lg font-bold text-zinc-900 dark:text-white tracking-tight">
                  ${escapeHtml(post.title)}
                </h2>
              </div>
              ${adminActions}
            </div>

            <div class="px-5 sm:px-6 pb-4">
              <p class="text-xs sm:text-sm text-zinc-600 dark:text-zinc-400 leading-relaxed font-light">
                ${escapeHtml(post.description)}
              </p>
            </div>

            <div class="px-5 sm:px-6 pb-4">
              <div class="relative rounded-lg overflow-hidden border border-zinc-200 dark:border-zinc-800 bg-zinc-100 dark:bg-black aspect-[16/9] max-h-96 group/img cursor-zoom-in" onclick="openLightbox('${imgUrl}', '${escapeHtml(post.title)}')">
                <img 
                  src="${imgUrl}" 
                  alt="${escapeHtml(post.title)}" 
                  loading="lazy"
                  class="w-full h-full object-cover object-center grayscale contrast-105 hover:grayscale-0 transition-all duration-300"
                >
                <div class="absolute inset-0 bg-black/40 opacity-0 group-hover/img:opacity-100 transition-opacity flex items-end p-3">
                  <span class="text-[10px] font-mono text-white bg-black/75 px-2 py-0.5 rounded backdrop-blur-sm flex items-center gap-1.5">
                    <i data-lucide="maximize-2" class="w-3 h-3"></i> Просмотр
                  </span>
                </div>
              </div>
            </div>

            <div class="px-5 sm:px-6 py-3 bg-zinc-50 dark:bg-black/40 border-t border-zinc-200 dark:border-zinc-800/80 flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3">
              <div class="flex items-center gap-2 text-xs font-mono text-zinc-400 truncate">
                <i data-lucide="arrow-right" class="w-3.5 h-3.5 text-zinc-500 flex-shrink-0"></i>
                <span class="truncate max-w-xs">${escapeHtml(post.link)}</span>
              </div>

              <a 
                href="${escapeHtml(post.link)}" 
                target="_blank" 
                rel="noopener noreferrer" 
                class="inline-flex items-center justify-center gap-2 px-3.5 py-1.5 rounded-lg bg-black hover:bg-zinc-800 text-white dark:bg-white dark:hover:bg-zinc-200 dark:text-black text-xs font-mono font-medium transition-colors"
              >
                <span>Перейти к проекту</span>
                <i data-lucide="arrow-up-right" class="w-3.5 h-3.5"></i>
              </a>
            </div>
          </article>
        `;
      }).join("");

      lucide.createIcons();
    }

    function escapeHtml(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function openModal(isEdit = false, post = null) {
      if (!isAdmin) {
        openLoginModal();
        return;
      }

      postModal.classList.remove("hidden");
      postModal.classList.add("flex");
      document.body.style.overflow = "hidden";

      if (isEdit && post) {
        modalTitle.textContent = "Редактировать проект";
        editPostId.value = post.id;
        document.getElementById("postTitle").value = post.title;
        document.getElementById("postDescription").value = post.description;
        document.getElementById("postLink").value = post.link;
        currentBase64 = post.imageUrl;
        selectedImageFile = null;
        showImagePreview(post.imageUrl);
        postImageUrl.value = post.imageUrl.startsWith("data:") ? "" : post.imageUrl;
      } else {
        modalTitle.textContent = "Новый проект";
        postForm.reset();
        editPostId.value = "";
        currentBase64 = "";
        selectedImageFile = null;
        hideImagePreview();
        switchToUrlTab();
      }
      lucide.createIcons();
    }

    function closeModal() {
      postModal.classList.add("hidden");
      postModal.classList.remove("flex");
      document.body.style.overflow = "";
      postForm.reset();
      currentBase64 = "";
      hideImagePreview();
    }

    function openLoginModal() {
      loginModal.classList.remove("hidden");
      loginModal.classList.add("flex");
      loginErrorMessage.classList.add("hidden");
      adminPasswordInput.value = "";
      setTimeout(() => adminPasswordInput.focus(), 50);
    }

    function closeLoginModal() {
      loginModal.classList.add("hidden");
      loginModal.classList.remove("flex");
      loginErrorMessage.classList.add("hidden");
    }

    function switchToUrlTab() {
      tabUrl.className = "font-bold underline text-black dark:text-white";
      tabFile.className = "text-zinc-500 hover:underline";
      urlInputContainer.classList.remove("hidden");
      fileInputContainer.classList.add("hidden");
    }

    function switchToFileTab() {
      tabFile.className = "font-bold underline text-black dark:text-white";
      tabUrl.className = "text-zinc-500 hover:underline";
      fileInputContainer.classList.remove("hidden");
      urlInputContainer.classList.add("hidden");
    }

    function showImagePreview(src) {
      modalImagePreview.src = src;
      modalImagePreviewContainer.classList.remove("hidden");
    }

    function hideImagePreview() {
      modalImagePreview.src = "";
      modalImagePreviewContainer.classList.add("hidden");
      uploadFileName.textContent = "";
      postImageFile.value = "";
      selectedImageFile = null;
      currentBase64 = "";
    }

    window.openLightbox = function(url, title) {
      lightboxImage.src = url;
      lightboxCaption.textContent = title;
      lightboxModal.classList.remove("hidden");
      lightboxModal.classList.add("flex");
      document.body.style.overflow = "hidden";
      lucide.createIcons();
    };

    function closeLightbox() {
      lightboxModal.classList.add("hidden");
      lightboxModal.classList.remove("flex");
      document.body.style.overflow = "";
      lightboxImage.src = "";
    }

    window.deletePost = async function(id) {
      if (!isAdmin) return;
      const target = posts.find(p => p.id === id);
      const title = target ? target.title : "проект";
      if (!confirm(`Удалить "${title}"?`)) return;

      const { error } = await supabaseClient.from("posts").delete().eq("id", id);
      if (error) {
        console.error("Supabase delete error:", error);
        showToast("Не удалось удалить проект");
        return;
      }
      await loadPosts();
      renderPosts();
      showToast("Проект удален");
    };

    window.editPost = function(id) {
      if (!isAdmin) return;
      const post = posts.find(p => p.id === id);
      if (post) openModal(true, post);
    };

    function setupEventListeners() {
      themeToggleBtn.addEventListener("click", toggleTheme);

      adminLoginBtn.addEventListener("click", openLoginModal);
      closeLoginModalBtn.addEventListener("click", closeLoginModal);
      loginModal.addEventListener("click", (e) => {
        if (e.target === loginModal) closeLoginModal();
      });

      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        loginErrorMessage.classList.add("hidden");
        const { error } = await supabaseClient.auth.signInWithPassword({
          email: adminEmailInput.value.trim(),
          password: adminPasswordInput.value
        });

        if (error) {
          console.error("Supabase login error:", error);
          loginErrorMessage.textContent = "Не удалось войти. Проверьте почту и пароль.";
          loginErrorMessage.classList.remove("hidden");
          return;
        }

        isAdmin = true;
        updateAdminUI();
        renderPosts();
        closeLoginModal();
        showToast("Авторизация успешна");
      });

      adminLogoutBtn.addEventListener("click", async () => {
        const { error } = await supabaseClient.auth.signOut();
        if (error) {
          console.error("Supabase logout error:", error);
          showToast("Не удалось выйти");
          return;
        }
        isAdmin = false;
        updateAdminUI();
        renderPosts();
        showToast("Выход выполнен");
      });

      openModalBtn.addEventListener("click", () => openModal(false));
      closeModalBtn.addEventListener("click", closeModal);
      cancelModalBtn.addEventListener("click", closeModal);
      postModal.addEventListener("click", (e) => {
        if (e.target === postModal) closeModal();
      });

      closeLightboxBtn.addEventListener("click", closeLightbox);
      lightboxModal.addEventListener("click", (e) => {
        if (e.target === lightboxModal) closeLightbox();
      });

      tabUrl.addEventListener("click", switchToUrlTab);
      tabFile.addEventListener("click", switchToFileTab);

      postImageUrl.addEventListener("input", (e) => {
        const val = e.target.value.trim();
        if (val) {
          currentBase64 = val;
          showImagePreview(val);
        } else {
          hideImagePreview();
        }
      });

      postImageFile.addEventListener("change", (e) => {
        const file = e.target.files[0];
        if (!file) return;
        selectedImageFile = file;
        uploadFileName.textContent = file.name;
        const reader = new FileReader();
        reader.onload = (event) => {
          currentBase64 = event.target.result;
          showImagePreview(currentBase64);
        };
        reader.readAsDataURL(file);
      });

      removePreviewBtn.addEventListener("click", () => {
        hideImagePreview();
        postImageUrl.value = "";
      });

      searchInput.addEventListener("input", (e) => {
        searchQuery = e.target.value;
        clearSearchBtn.classList.toggle("hidden", !searchQuery);
        renderPosts();
      });

      clearSearchBtn.addEventListener("click", () => {
        searchInput.value = "";
        searchQuery = "";
        clearSearchBtn.classList.add("hidden");
        renderPosts();
      });

      postForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        if (!isAdmin) {
          showToast("Ошибка прав доступа");
          closeModal();
          return;
        }

        const submitButton = document.getElementById("submitPostBtn");
        submitButton.disabled = true;
        submitButton.textContent = "Сохранение...";

        try {
          const title = document.getElementById("postTitle").value.trim();
          const description = document.getElementById("postDescription").value.trim();
          const link = document.getElementById("postLink").value.trim();
          const idToEdit = editPostId.value;

          let photo = currentBase64 || postImageUrl.value.trim();
          if (selectedImageFile) photo = await uploadProjectImage(selectedImageFile);
          if (!photo) photo = `https://placehold.co/1200x600/18181b/ffffff?text=${encodeURIComponent(title)}`;

          const payload = { title, description, link, image_url: photo };
          let error;
          if (idToEdit) {
            ({ error } = await supabaseClient.from("posts").update(payload).eq("id", idToEdit));
          } else {
            ({ error } = await supabaseClient.from("posts").insert(payload));
          }

          if (error) throw error;
          await loadPosts();
          renderPosts();
          closeModal();
          showToast(idToEdit ? "Проект обновлен" : "Проект опубликован");
        } catch (error) {
          console.error("Supabase save error:", error);
          showToast("Ошибка сохранения проекта");
        } finally {
          submitButton.disabled = false;
          submitButton.textContent = "Опубликовать";
        }
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          if (!lightboxModal.classList.contains("hidden")) closeLightbox();
          else if (!postModal.classList.contains("hidden")) closeModal();
          else if (!loginModal.classList.contains("hidden")) closeLoginModal();
        }
      });
    }

    window.addEventListener("load", init);
  </script>
</body>
</html>
